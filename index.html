<style>
/* Layout: one calm column, one thing at a time. Tabs: plan of the day > fiches > quiz > contrôles > bilan > parent. Subject colour = hue. */
:root{
  --bg:#edf0f6; --surface:#fafbfd; --ink:#1b2240; --muted:#586180; --line:#d3d9e6;
  --accent:#3b4cd0; --accent-ink:#ffffff; --accent-soft:#e3e7fb;
  --ok:#1c7548; --ok-bg:#e1f2e8; --mid:#8f5400; --mid-bg:#fcefd4; --ko:#a3283a; --ko-bg:#fbe3e6;
  --subj-l:36%; --subj-bg-l:91%;
  --display:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131728; --surface:#1c2136; --ink:#e8ebf6; --muted:#a2aac6; --line:#343b59;
    --accent:#8d9aff; --accent-ink:#0f1328; --accent-soft:#262d52;
    --ok:#74d5a3; --ok-bg:#163426; --mid:#f0ba5e; --mid-bg:#3a2c11; --ko:#ff8a98; --ko-bg:#3d1820;
    --subj-l:74%; --subj-bg-l:21%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131728; --surface:#1c2136; --ink:#e8ebf6; --muted:#a2aac6; --line:#343b59;
  --accent:#8d9aff; --accent-ink:#0f1328; --accent-soft:#262d52;
  --ok:#74d5a3; --ok-bg:#163426; --mid:#f0ba5e; --mid-bg:#3a2c11; --ko:#ff8a98; --ko-bg:#3d1820;
  --subj-l:74%; --subj-bg-l:21%; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}

:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 18px}

.progress{display:flex;flex-direction:column;gap:4px;min-width:190px;font-size:.9rem;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s ease}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}

.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .badge{display:inline-block;min-width:1.4em;margin-left:6px;border-radius:99px;background:var(--ko);color:#fff;font-size:.78rem;padding:0 6px;text-align:center}

.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:700;font-size:.95rem}

.blocs{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px}
.bloc{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
.bloc.g{border-color:var(--ok)} .bloc.o{border-color:var(--mid)} .bloc.r{border-color:var(--ko)}
.bhead{width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}

.bbody{padding:0 16px 18px;display:flex;flex-direction:column;gap:14px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 18px;font-family:var(--display);font-weight:600;font-size:1.02rem}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.small{padding:7px 13px;font-size:.92rem}

.rb{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700}
.rb.g[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}

label.note{display:flex;flex-direction:column;gap:4px;font-size:.92rem;color:var(--muted)}
textarea,input[type=password],input[type=text]{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}

/* fiches */

.flow{display:flex;flex-direction:column;gap:0;align-items:stretch}
.flow .st{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 12px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;font-size:.92rem;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}

td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
.mem{font-family:var(--display);font-size:1.05rem;font-weight:600}
.lumni{display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.sw{display:flex;gap:8px;flex-wrap:wrap}

/* quiz */

.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:1.02rem}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--ko);background:var(--ko-bg);color:var(--ko)}
.qlist{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.qlist li{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center}
.qlist li>span{min-width:0}
.pill{display:inline-block;font-size:.82rem;font-weight:700;border-radius:99px;padding:3px 10px}
.pill.g{background:var(--ok-bg);color:var(--ok)} .pill.o{background:var(--mid-bg);color:var(--mid)} .pill.r{background:var(--ko-bg);color:var(--ko)} .pill.n{background:var(--bg);color:var(--muted)}
.dotsrow{display:flex;gap:4px}
.dotsrow i{width:12px;height:12px;border-radius:50%;background:var(--line)}

/* contrôles */
.ctrl{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.ctrl.g{border-color:var(--ok)} .ctrl.o{border-color:var(--mid)} .ctrl.r{border-color:var(--ko)}

.cl label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}

@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.kt{display:inline-block;font-family:var(--body);font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:1px 7px;vertical-align:2px}

.day .mn{font-size:.68rem;color:var(--muted)} .day.sel .mn{color:var(--accent-ink)}
.prog{font-size:1.02rem}
ul.cl2{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px} ul.cl2 li.ok{color:var(--ok);font-weight:700}
.item{font-family:var(--display);font-size:1.15rem;font-weight:500;background:var(--bg);border-radius:12px;padding:12px 14px}
.calcq{font-family:var(--display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
#cform input{max-width:12ch;font-size:1.3rem;font-variant-numeric:tabular-nums}
.support{margin:0;border-left:4px solid var(--line);padding:8px 12px;background:var(--bg);border-radius:0 10px 10px 0;font-style:italic}
.model{background:var(--ok-bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.box2b{background:var(--bg);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.flash{background:var(--accent-soft);border-radius:var(--r);padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:10px}
.flash .ff{font-family:var(--display);font-size:2rem;font-weight:600}
.flash .fb{font-size:1.3rem;font-weight:700;color:var(--accent)}
.steps.placed li{color:var(--ok);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.cart-list input{width:26px;height:26px;flex:0 0 auto;margin-top:1px;accent-color:var(--ok)}
.cart-list .cn{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.cart-list .cart-h{display:block;margin-top:2px;font-weight:400}
.cart-list li.now label{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

.cart-nav{align-items:center;gap:10px}

<div class="app">
  <header class="top">
    <div class="stack" style="gap:4px">
      <span class="tag">Hugo · 4e5 · semaine du 11 au 17 novembre</span>
      <h1>Mon plan de révision</h1>
    </div>
    <div class="progress" aria-live="polite">
      <span><b id="pcount">0</b> blocs faits sur <span id="ptotal">0</span></span>

<script>
/* ================= DONNÉES ================= */
const H={Maths:225,"Français":340,Anglais:10,Espagnol:45,"Histoire-Géo-EMC":28,SVT:145,"Physique-Chimie":190,Technologie:265,Musique:300,"Préparation":250};
const LUMNI=q=>"https://www.lumni.fr/recherche?query="+encodeURIComponent(q);

/* ---------- Fiches ---------- */
const FICHES=[
{id:"fr-fant",s:"Français",t:"Le Horla et le récit fantastique",src:"Cours du 3 novembre",
 lumni:[["Le registre fantastique (« Fais pas genre ! », 2 min)",LUMNI("registre fantastique")],["Cours Lumni collège : récit fantastique",LUMNI("récit fantastique collège")]],
 short:[
  "<b>Horla</b> = <b>hors</b> (dehors) + <b>là</b> (ici) : un être venu d'ailleurs qui s'installe chez nous.",
  "Le fantastique en 5 étapes : <b>cadre normal → événement étrange → peur, surprise, incompréhension → doute → 2 explications</b>.",
  "Les 2 explications : <b>surnaturelle</b> (un esprit, un être invisible) ou <b>rationnelle</b> (folie, hallucination, rêve).",
  "<b>Fantastique</b> = monde réel + doute. <b>Merveilleux</b> = fées, magie acceptée (« Il était une fois »). <b>Science-fiction</b> = futur, technologies.",
  "<b>Imparfait</b> = décor, habitude, action longue. <b>Passé simple</b> = action soudaine, brève, qui fait avancer l'histoire."],
 full:`
 <div class="fsec"><h3>1. Ce que veut dire « Horla »</h3>
  <div class="box"><p class="mem">HORS + LÀ</p><p><b>Hors</b> = dehors, en dehors de notre monde. <b>Là</b> = ici, tout près de nous.</p><p>Le Horla est donc un être <b>qui vient d'ailleurs mais qui est là, chez nous</b>. C'est un mot inventé par Maupassant (un néologisme).</p></div></div>
 <div class="fsec"><h3>2. Comment on reconnaît un récit fantastique</h3>
  <p class="muted small">Mémo : <b>C.E.R.D.D.</b> = Cadre, Événement, Réactions, Doute, Deux explications.</p>
  <div class="flow">
   <div class="st"><b>C</b>adre normal : le monde réel, la vie de tous les jours, nos lois physiques.</div><div class="ar">↓</div>
   <div class="st"><b>É</b>vénement étrange qu'on ne peut pas expliquer (un objet bouge seul, une présence invisible).</div><div class="ar">↓</div>
   <div class="st"><b>R</b>éactions du personnage : <b>peur</b>, <b>surprise</b>, <b>incompréhension</b>.</div><div class="ar">↓</div>
   <div class="st"><b>D</b>oute jusqu'à la fin : on ne sait pas ce qui est vrai.</div><div class="ar">↓</div>
   <div class="st"><b>D</b>eux explications possibles :<br>• <b>surnaturelle</b> : un esprit, un revenant, un être invisible existe vraiment ;<br>• <b>rationnelle</b> : le narrateur devient fou, il hallucine, il rêve.</div>
  </div>
  <p class="tip">En classe : le fantastique ne commence <b>pas</b> dans un autre monde. Il commence dans <b>notre</b> monde, puis quelque chose de bizarre arrive.</p></div>
 <div class="fsec"><h3>3. Ne pas confondre trois genres</h3>
  <div class="table-wrap"><table>
   <tr><th>Genre</th><th>Le surnaturel</th><th>Où, quand</th><th>Le personnage…</th></tr>
   <tr><td><b>Fantastique</b></td><td>présence invisible, double, hallucination</td><td>notre monde, aujourd'hui</td><td>a peur et <b>doute</b></td></tr>
   <tr><td><b>Merveilleux</b></td><td>fées, sorcières, ogres, baguette magique</td><td>« Il était une fois », pas d'époque</td><td>trouve ça <b>normal</b></td></tr>
   <tr><td><b>Science-fiction</b></td><td>machines, robots, voyages dans le temps</td><td>le futur</td><td>l'explique par la <b>science</b></td></tr>
  </table></div>
  <p class="tip">Question posée en classe : « Des fées, c'est fantastique ? » Non : les fées appartiennent au <b>merveilleux</b>, car personne ne s'en étonne.</p></div>
 <div class="fsec"><h3>4. Les temps du récit</h3>
  <div class="two">
   <div class="box"><p class="key">Imparfait = le fond du décor</p><ul><li>décrire un lieu, une personne</li><li>une habitude (« chaque soir, il buvait… »)</li><li>une action longue (« pendant que je <b>méditais</b>… »)</li></ul></div>
   <div class="box"><p class="key">Passé simple = ce qui arrive d'un coup</p><ul><li>action soudaine, brève, terminée</li><li>action qui fait avancer l'histoire</li><li>(« soudain, la porte <b>s'ouvrit</b> »)</li></ul></div>
  </div>
  <p class="tip">Méthode : je me demande « ça <b>dure</b> ou ça <b>arrive d'un coup</b> ? » Ça dure → imparfait. D'un coup → passé simple.</p></div>
 <div class="fsec"><h3>5. Questions possibles au contrôle</h3>
  <ol><li>Quelles sont les 5 caractéristiques d'un récit fantastique ? → C.E.R.D.D.</li><li>Quelle différence entre fantastique, merveilleux et science-fiction ? → le tableau.</li><li>Que veut dire le mot « Horla » ? → hors + là.</li><li>Pourquoi l'imparfait et le passé simple dans un récit fantastique ? → l'imparfait installe le calme, le passé simple fait surgir l'étrange.</li></ol></div>`},

{id:"ma-rel",s:"Maths",t:"Calculer avec les nombres relatifs",src:"Cours du 3 novembre + cours de septembre-octobre",
 lumni:[["Nombres relatifs (vidéos Lumni)",LUMNI("nombres relatifs")],["Priorités opératoires",LUMNI("priorités opératoires")]],
 short:["Ordre : <b>parenthèses</b>, puis <b>× et ÷</b>, puis <b>+ et −</b>.","× et ÷ : <b>signes pareils → +</b>, <b>signes différents → −</b>.","+ : signes différents → je <b>soustrais</b> les distances à zéro et je garde le signe du plus « loin de zéro ».","Le « − » peut être le signe d'un <b>nombre</b> (−4) ou d'une <b>opération</b> (5 − 4). Je mets des parenthèses : 9 + (−4)."],
 full:`
 <div class="fsec"><h3>1. L'ordre des calculs</h3>
  <div class="box"><p class="mem">1. ( )  →  2. × ÷  →  3. + −</p><p>Exemple : 5 − 2 × (−3) = 5 − (−6) = 5 + 6 = <b>11</b>. On fait d'abord 2 × (−3).</p></div></div>
 <div class="fsec"><h3>2. Deux règles différentes</h3>
  <div class="two">
   <div class="box"><p class="key">Multiplier et diviser</p><p>Je compte les signes −.</p><ul><li>(+) × (+) = +</li><li>(−) × (−) = +</li><li>(+) × (−) = −</li><li>(−) × (+) = −</li></ul><p>7 × (−3) = <b>−21</b><br>(−12) ÷ 4 = <b>−3</b></p></div>
   <div class="box"><p class="key">Additionner</p><ul><li>Même signe : j'additionne et je garde le signe.<br>(−3) + (−5) = −8</li><li>Signes différents : je fais la différence des distances à zéro, je garde le signe du plus loin de zéro.<br>9 + (−4) = <b>5</b> (9 est plus loin de zéro)</li></ul></div>
  </div>
  <p class="tip">Piège vu en classe : la règle des signes de la multiplication ne marche <b>pas</b> pour l'addition. (−3) + (−5) n'est pas +8.</p></div>
 <div class="fsec"><h3>3. Traduire une phrase en calcul</h3>
  <div class="table-wrap"><table>
   <tr><th>La phrase</th><th>Le calcul</th><th>Résultat</th></tr>
   <tr><td>Le <b>produit</b> de −3 par la <b>somme</b> de 9 et de −4</td><td>−3 × (9 + (−4))</td><td class="n">−15</td></tr>
   <tr><td>La <b>somme</b> de −7 et du <b>produit</b> de 3 par 5</td><td>−7 + 3 × 5</td><td class="n">8</td></tr>
   <tr><td>Le <b>quotient</b> de la somme de −5 et 9 par −10</td><td>(−5 + 9) ÷ (−10)</td><td class="n">−0,4</td></tr>
  </table></div>
  <p class="tip">Produit = ×. Somme = +. Différence = −. Quotient = ÷. Le premier mot dit la <b>dernière</b> opération. Et je n'oublie pas le signe : un élève a répondu 0,4 au lieu de <b>−0,4</b>.</p></div>`},

{id:"ma-stat",s:"Maths",t:"Statistiques : effectif et fréquence",src:"Cours du 3 novembre (chapitre 6)",
 lumni:[["Statistiques, effectifs et fréquences",LUMNI("fréquence statistiques")]],
 short:["<b>Population</b> = qui on étudie. <b>Caractère</b> = ce qu'on regarde chez chacun.","<b>Effectif</b> d'une valeur = combien de fois elle apparaît. <b>Effectif total</b> = tout le monde.","<b>Fréquence = effectif ÷ effectif total</b>. Fraction, décimal ou % (× 100).","Une fréquence est <b>entre 0 et 1</b>. La somme des fréquences = <b>1</b> (ou 100 %)."],
 full:`
 <div class="fsec"><h3>1. L'exemple du cours</h3>
  <p>On a demandé aux 28 élèves d'une classe de 4e combien ils ont de frères et sœurs :</p>
  <p class="box" style="font-variant-numeric:tabular-nums">2 ; 1 ; 0 ; 1 ; 4 ; 0 ; 3 ; 2 ; 0 ; 1 ; 2 ; 5 ; 1 ; 2 ; 2 ; 3 ; 0 ; 0 ; 1 ; 3 ; 1 ; 2 ; 4 ; 3 ; 0 ; 4 ; 1 ; 2</p>
  <ul><li><b>Population</b> : les 28 élèves de cette classe de 4e.</li><li><b>Caractère étudié</b> : le nombre de frères et sœurs.</li></ul></div>
 <div class="fsec"><h3>2. Le tableau complété</h3>
  <div class="table-wrap"><table>
   <tr><th>Frères et sœurs</th><th class="n">0</th><th class="n">1</th><th class="n">2</th><th class="n">3</th><th class="n">4</th><th class="n">5</th><th class="n">Total</th></tr>
   <tr><th>Effectif</th><td class="n">6</td><td class="n">7</td><td class="n">7</td><td class="n">4</td><td class="n">3</td><td class="n">1</td><td class="n"><b>28</b></td></tr>
   <tr><th>Fréquence (fraction)</th><td class="n">6/28</td><td class="n">7/28</td><td class="n">7/28</td><td class="n">4/28</td><td class="n">3/28</td><td class="n">1/28</td><td class="n"><b>28/28 = 1</b></td></tr>
   <tr><th>Décimal (au centième)</th><td class="n">0,21</td><td class="n">0,25</td><td class="n">0,25</td><td class="n">0,14</td><td class="n">0,11</td><td class="n">0,04</td><td class="n">1</td></tr>
   <tr><th>Pourcentage (à l'unité)</th><td class="n">21 %</td><td class="n">25 %</td><td class="n">25 %</td><td class="n">14 %</td><td class="n">11 %</td><td class="n">4 %</td><td class="n"><b>100 %</b></td></tr>
  </table></div>
  <p class="tip">Méthode pour compter sans me tromper : je barre chaque nombre de la liste au crayon en faisant un bâton dans la bonne colonne. À la fin, je vérifie que le total fait 28.</p></div>
 <div class="fsec"><h3>3. Les formules</h3>
  <div class="box"><p class="mem">fréquence = effectif ÷ effectif total</p><p>6 ÷ 28 ≈ 0,214… → <b>0,21</b> → × 100 → <b>21 %</b></p></div>
  <ul><li>Une fréquence est toujours <b>entre 0 et 1</b> (entre 0 % et 100 %).</li><li>Toutes les fréquences ensemble font <b>1</b> (ou 100 %). C'est ma vérification.</li></ul></div>`},

{id:"svt",s:"SVT",t:"Photosynthèse, stomates et microscope",src:"Bilans 2 et 3 + TP du 13 octobre · évaluation le mardi 10",
 lumni:[["La photosynthèse",LUMNI("photosynthèse")],["Utiliser un microscope",LUMNI("microscope")]],
 short:["eau + dioxyde de carbone → (lumière) → matière organique + dioxygène : c'est la <b>photosynthèse</b>.","Elle se fait dans les <b>chloroplastes</b> des cellules des feuilles (pigment vert : chlorophylle).","Le <b>Lugol</b> (eau iodée) colore l'<b>amidon</b> en <b>bleu-noir</b>.","Un <b>stomate</b> = 2 <b>cellules de garde</b> autour d'un trou, l'<b>ostiole</b>.","Dessin : crayon, titre, grossissement, légendes à la règle, traits horizontaux, pas de couleur."],
 full:`
 <div class="fsec"><h3>1. La photosynthèse (bilan 2)</h3>
  <div class="box"><p class="mem">eau + dioxyde de carbone  —lumière→  matière organique + dioxygène</p><p class="small">6 H₂O + 6 CO₂ → C₆H₁₂O₆ + 6 O₂</p></div>
  <ul><li>Les plantes fabriquent de l'<b>amidon</b> (matière organique).</li><li>On le repère avec l'<b>eau iodée</b> (le <b>Lugol</b>) : les zones riches en amidon deviennent <b>bleu-noir</b>.</li><li>Ça se passe dans les <b>chloroplastes</b>, de petits compartiments des cellules des feuilles qui contiennent la <b>chlorophylle</b> (pigment vert).</li><li>Il faut de la <b>lumière</b>. La plante rejette du <b>dioxygène</b> dans l'air.</li></ul>
  <p class="tip">L'expérience des deux sacs : la <b>potasse</b> absorbe le CO₂, l'<b>eau de chaux</b> se trouble s'il y a du CO₂. La feuille privée de CO₂ ne fabrique pas d'amidon : le CO₂ est <b>indispensable</b>.</p></div>
 <div class="fsec"><h3>2. Le stomate (bilan 3)</h3>
  <div class="two">
   <svg viewBox="0 0 260 170" role="img" aria-label="Schéma d'un stomate : deux cellules de garde autour de l'ostiole" style="width:100%;max-width:320px">
    <rect x="4" y="4" width="252" height="162" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
    <ellipse cx="108" cy="85" rx="28" ry="58" fill="hsl(145 55% var(--subj-bg-l))" stroke="hsl(145 60% var(--subj-l))" stroke-width="3"/>
    <ellipse cx="152" cy="85" rx="28" ry="58" fill="hsl(145 55% var(--subj-bg-l))" stroke="hsl(145 60% var(--subj-l))" stroke-width="3"/>
    <ellipse cx="130" cy="85" rx="7" ry="34" fill="var(--surface)" stroke="hsl(145 60% var(--subj-l))" stroke-width="2"/>
    <circle cx="100" cy="70" r="7" fill="hsl(145 60% var(--subj-l))"/><circle cx="160" cy="100" r="7" fill="hsl(145 60% var(--subj-l))"/>
    <line x1="137" y1="85" x2="214" y2="85" stroke="var(--ink)" stroke-width="1.5"/><text x="216" y="89" font-size="13" fill="var(--ink)">ostiole</text>
    <line x1="84" y1="120" x2="30" y2="150" stroke="var(--ink)" stroke-width="1.5"/><text x="10" y="164" font-size="12" fill="var(--ink)">cellule de garde</text>
   </svg>
   <div class="stack" style="gap:6px"><p>Un <b>stomate</b> = deux <b>cellules de garde</b> en forme de haricot, avec un trou au milieu : l'<b>ostiole</b>. C'est par là que les gaz (CO₂, O₂) entrent et sortent de la feuille.</p><p>Autour : les <b>cellules épidermiques</b>, avec une <b>membrane</b>, un <b>noyau</b> et du <b>cytoplasme</b>.</p></div>
  </div></div>
 <div class="fsec"><h3>3. Le microscope : la préparation</h3>
  <ol class="steps"><li>Je mets une goutte d'eau sur la lame.</li><li>Je pose un petit morceau d'épiderme de feuille (poireau) bien à plat.</li><li>Je pose la lamelle doucement, en biais, pour ne pas faire de bulles.</li><li>Je commence au <b>plus petit grossissement</b>, je fais la mise au point, puis je passe au fort grossissement.</li></ol></div>
 <div class="fsec"><h3>4. Le dessin d'observation : les règles</h3>
  <ul><li><b>Crayon à papier</b> bien taillé, pas de couleur.</li><li>Un <b>titre</b> (ce que j'observe) et le <b>grossissement</b> (ex. × 400).</li><li>Je dessine <b>seulement ce que je vois</b>, en grand, au milieu de la feuille.</li><li><b>Légendes</b> sur le côté, reliées par des <b>traits tirés à la règle</b>, horizontaux, qui ne se croisent pas.</li></ul>
  <p class="tip">Pour le contrôle : dessine 3 fois le stomate à partir du schéma, en chronométrant 5 minutes, et coche les règles une par une.</p></div>`},

{id:"pc",s:"Physique-Chimie",t:"Les interactions",src:"Chapitre 2 · exercices pour le vendredi 6",
 lumni:[["La gravitation",LUMNI("gravitation")],["Les actions mécaniques",LUMNI("action mécanique")]],
 short:["<b>Système</b> = l'objet que j'étudie.","Une action mécanique peut <b>déformer</b>, <b>mettre en mouvement</b> ou <b>changer le mouvement</b>.","Si A agit sur B, B agit sur A : c'est une <b>interaction</b>.","<b>Contact</b> ou <b>à distance</b>. Contact <b>localisé</b> (petite zone) ou <b>réparti</b> (grande surface).","<b>DOI</b> : le système au centre, les objets autour, un trait par interaction."],
 full:`
 <div class="fsec"><h3>1. Le vocabulaire</h3>
  <ul><li><b>Système</b> : l'objet que je choisis d'étudier (le ballon, la charge, le grimpeur).</li><li>Si le système est <b>déformé</b>, <b>mis en mouvement</b> ou si son <b>mouvement change</b>, c'est qu'il subit une <b>action mécanique</b>.</li><li>Quand A agit sur B, B agit aussi sur A : c'est une <b>interaction</b>.</li></ul></div>
 <div class="fsec"><h3>2. Les types d'interactions</h3>
  <div class="two">
   <div class="box"><p class="key">De contact</p><p>Les objets se touchent.</p><ul><li><b>localisée</b> : sur une petite zone (la main sur le ballon)</li><li><b>répartie</b> : sur une grande surface (le vent sur la voile, l'eau sur la coque)</li></ul></div>
   <div class="box"><p class="key">À distance</p><p>Les objets ne se touchent pas.</p><ul><li>la <b>gravitation</b> (la Terre attire le bateau, la charge, le grimpeur)</li><li>l'interaction magnétique (aimant)</li></ul></div>
  </div></div>
 <div class="fsec"><h3>3. Le DOI (diagramme objets-interactions)</h3>
  <svg viewBox="0 0 320 150" role="img" aria-label="Exemple de DOI pour la charge d'une grue" style="width:100%;max-width:420px">
   <rect x="120" y="55" width="80" height="40" rx="8" fill="hsl(190 55% var(--subj-bg-l))" stroke="hsl(190 60% var(--subj-l))" stroke-width="3"/><text x="160" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">Charge</text>
   <ellipse cx="50" cy="35" rx="42" ry="20" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><text x="50" y="40" text-anchor="middle" font-size="13" fill="var(--ink)">Câble</text>
   <ellipse cx="270" cy="35" rx="42" ry="20" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><text x="270" y="40" text-anchor="middle" font-size="13" fill="var(--ink)">Terre</text>
   <ellipse cx="160" cy="128" rx="42" ry="18" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><text x="160" y="133" text-anchor="middle" font-size="13" fill="var(--ink)">Air</text>
   <line x1="88" y1="44" x2="120" y2="62" stroke="var(--ink)" stroke-width="2.5"/>
   <line x1="232" y1="44" x2="200" y2="62" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="6 5"/>
   <line x1="160" y1="95" x2="160" y2="110" stroke="var(--ink)" stroke-width="2.5"/>
  </svg>
  <p class="small muted">Trait plein = contact. Pointillés = à distance. L'interaction avec l'air est très faible : on peut la <b>négliger</b>.</p></div>
 <div class="fsec"><h3>4. La gravitation</h3>
  <p>C'est une interaction <b>attractive à distance</b> entre deux objets qui ont une masse. Elle est <b>plus forte</b> si les masses sont <b>plus grandes</b> et si les objets sont <b>plus proches</b>. Elle fait tourner la Lune autour de la Terre et la Terre autour du Soleil.</p></div>`},

{id:"te",s:"Technologie",t:"Le protocole de test",src:"Évaluation le jeudi 5 (écrit + pratique)",
 lumni:[["La démarche expérimentale",LUMNI("démarche expérimentale")]],
 short:["Un protocole a <b>7 parties</b> : but, matériel, ce que je change, ce que je garde pareil, étapes, tableau, conclusion.","Je ne change qu'<b>une seule chose</b> à la fois.","Étapes <b>numérotées</b>, une action par ligne, avec un verbe (« Allumer », « Mesurer »).","Pratique : je lis <b>toute</b> la consigne avant de commencer, puis je coche chaque étape."],
 full:`
 <div class="fsec"><h3>1. Les 7 parties d'un protocole</h3>
  <p class="muted small">Mémo : <b>B.M.C.G.É.T.C.</b> = « <b>B</b>ien <b>M</b>esurer, <b>C</b>'est <b>G</b>agner : <b>É</b>tapes, <b>T</b>ableau, <b>C</b>onclusion ».</p>
  <ol class="steps">
   <li><b>But</b> : ce que je veux savoir (« Quelle ampoule éclaire le plus ? »).</li>
   <li><b>Matériel</b> : la liste de ce qu'il faut.</li>
   <li><b>Ce que je change</b> : une seule chose (le type d'ampoule).</li>
   <li><b>Ce que je garde pareil</b> : tout le reste (même distance, même durée, même appareil de mesure).</li>
   <li><b>Étapes</b> numérotées, dans l'ordre, avec un verbe d'action.</li>
   <li><b>Tableau</b> pour noter les résultats.</li>
   <li><b>Conclusion</b> : je réponds au but.</li></ol></div>
 <div class="fsec"><h3>2. Exemple : comparer la chaleur de deux ampoules</h3>
  <div class="box"><p><b>But</b> : quelle ampoule chauffe le plus ?</p><p><b>Matériel</b> : 2 ampoules (LED, halogène), 1 lampe, 1 thermomètre, 1 chronomètre, 1 règle.</p><p><b>Je change</b> : l'ampoule. <b>Je garde</b> : thermomètre à 10 cm, 5 minutes allumée, même pièce.</p><p><b>Étapes</b> : 1. Placer le thermomètre à 10 cm. 2. Noter la température de départ. 3. Allumer l'ampoule 1 pendant 5 min. 4. Noter la température. 5. Éteindre, attendre que tout refroidisse. 6. Recommencer avec l'ampoule 2.</p><p><b>Tableau</b> : ampoule | température départ | après 5 min | différence.</p><p><b>Conclusion</b> : « L'ampoule … chauffe le plus car … ».</p></div></div>
 <div class="fsec"><h3>3. Pour la partie pratique</h3>
  <ul><li>Je lis tout le protocole une fois, sans rien toucher.</li><li>Je fais les étapes <b>dans l'ordre</b>, et je coche au crayon chaque étape finie.</li><li>Je note les mesures <b>tout de suite</b> dans le tableau.</li></ul></div>`},

{id:"an",s:"Anglais",t:"The Roaring Twenties et le prétérit",src:"Séquence 3 · interro du DST et verbes irréguliers",
 lumni:[["Les années folles / la crise de 1929",LUMNI("crise de 1929")],["Le prétérit en anglais",LUMNI("prétérit anglais")]],
 short:["<b>Roaring Twenties</b> = les années 1920 aux États-Unis : jazz, fêtes, croissance.","<b>Prohibition</b> (1920-1933) : alcool interdit → bars cachés (<b>speakeasies</b>) et <b>gangsters</b>.","<b>1929</b> : le krach de Wall Street (<b>Wall Street Crash</b>).","Prétérit régulier : verbe + <b>-ed</b>. Irréguliers : à apprendre (go → <b>went</b>).","Négation : <b>didn't</b> + verbe de base. Question : <b>Did</b> + sujet + verbe de base ?"],
 full:`
 <div class="fsec"><h3>1. The Roaring Twenties</h3>
  <ul><li>Les « années rugissantes » : les <b>années 1920</b> aux <b>États-Unis</b>. L'économie va bien, on écoute du <b>jazz</b>, on danse, on achète des voitures.</li><li><b>Prohibition</b> (1920-1933) : l'alcool est interdit. On boit en cachette dans des <b>speakeasies</b>. Les <b>gangsters</b> vendent l'alcool illégalement (Al Capone).</li><li><b>John Dillinger</b> : un célèbre braqueur de banques des années 1930, recherché par le FBI.</li><li><b>1929</b> : le <b>Wall Street Crash</b>, la Bourse s'effondre. C'est la fin des années folles.</li></ul></div>
 <div class="fsec"><h3>2. Le prétérit (parler du passé terminé)</h3>
  <div class="two">
   <div class="box"><p class="key">Affirmation</p><p>Réguliers : <b>-ed</b><br>play → played, watch → watched</p><p>Irréguliers :<br>go → went, have → had, be → was/were, make → made, take → took</p></div>
   <div class="box"><p class="key">Négation et question</p><p>He <b>didn't</b> rob the bank.<br>(didn't + verbe <b>de base</b>)</p><p><b>Did</b> he rob the bank?<br>Yes, he <b>did</b>. / No, he <b>didn't</b>.</p></div>
  </div>
  <p class="tip">Mots qui appellent le prétérit : <b>yesterday</b>, <b>last</b> year, in <b>1929</b>, <b>ago</b>.</p></div>
 <div class="fsec"><h3>3. Les verbes irréguliers (interros à partir du 9 novembre)</h3>
  <ol class="steps"><li>Je prends <b>5 verbes</b> du planning, pas plus.</li><li>Je les lis à voix haute en tapant dans les mains à chaque forme : <i>go – went – gone</i>.</li><li>Je cache et je les dis. Je recopie seulement ceux que j'ai ratés (avec Cantoo si besoin).</li><li>Le lendemain, je recommence avec les 5 d'avant + 5 nouveaux.</li></ol></div>`},

{id:"es",s:"Espagnol",t:"Soler et comparer",src:"Fiche « Husos y usos horarios » · pour le vendredi 6",
 lumni:[["Espagnol : les habitudes",LUMNI("espagnol habitudes")]],
 short:["<b>Soler</b> + infinitif = avoir l'habitude de.","suelo, sueles, suele, solemos, soléis, suelen.","Opposer : <b>mientras que</b> (alors que), <b>sin embargo</b> (cependant), <b>en cambio</b> (en revanche)."],
 full:`
 <div class="fsec"><h3>1. Soler = avoir l'habitude de</h3>
  <div class="table-wrap"><table><tr><th>yo</th><th>tú</th><th>él/ella</th><th>nosotros</th><th>vosotros</th><th>ellos</th></tr><tr><td>suelo</td><td>sueles</td><td>suele</td><td>solemos</td><td>soléis</td><td><b>suelen</b></td></tr></table></div>
  <p>Los españoles <b>suelen</b> cenar a las diez. (Les Espagnols dînent en général à 22 h.)</p></div>
 <div class="fsec"><h3>2. Comparer et opposer</h3>
  <ul><li><b>mientras que</b> = alors que</li><li><b>sin embargo</b> = cependant</li><li><b>en cambio</b> = en revanche</li></ul>
  <div class="box"><p>Los españoles suelen comer a las dos <b>mientras que</b> los ingleses suelen comer a la una.</p><p>En España el telediario es a las nueve. <b>En cambio</b>, en Inglaterra es a las seis.</p></div>
  <p class="tip">Pour les 5 phrases : 1 phrase = 1 moment de la journée (desayuno, comida, cena, telediario, dormir). Je change seulement l'heure et le pays.</p></div>`},

FICHES.push(
{id:"fr-horla2",s:"Français",t:"Le Horla : journal intime et méthode d'analyse",src:"Cours du 4 novembre (séance 3)",
 lumni:[["Le registre fantastique (« Fais pas genre ! », 2 min)",LUMNI("registre fantastique")],["Maupassant",LUMNI("Maupassant")]],
 short:[
  "<b>Le Horla</b> est un <b>journal intime fictif</b> : des dates, le « je », les pensées du narrateur. C'est inventé par Maupassant.",
  "Le « je » : on croit que c'est vrai, on ressent ce qu'il ressent, et on <b>ne voit que ce qu'il voit</b> : impossible de savoir s'il est fou ou si le Horla existe.",
  "<b>8 mai</b> (début) : le narrateur est <b>heureux</b>, plein de joie (pas triste !). Preuves : <b>phrases exclamatives</b> (« Quelle journée admirable ! ») et une <b>énumération</b> (les racines, les nourritures, les odeurs…).",
  "Méthode pour analyser : <b>1. Nommer</b> le procédé, <b>2. Citer</b> entre guillemets, <b>3. Expliquer</b> l'effet. Toujours en <b>phrases complètes</b>, jamais de tirets.",
  "Scène de Lénore : <b>imparfait</b> = le décor (« je méditais », les tisons) ; <b>passé simple</b> = l'action qui fait avancer (« soudain », « j'ouvris la porte »). Minuit et décembre = nuit, froid, mort : on a peur."],
 full:`
 <div class="fsec"><h3>1. Un journal intime… inventé</h3>
  <div class="table-wrap"><table>
   <tr><th>Journal de bord</th><th>Journal intime</th><th>Journal intime fictif</th></tr>
   <tr><td>Pendant un voyage : où on est allé, ce qu'on a fait. Pas de sentiments.</td><td>Écrit souvent, avec des dates. On raconte ce qu'on ressent, ce qu'on pense.</td><td><b>Le Horla.</b> Il a la forme d'un journal intime, mais c'est Maupassant qui l'a inventé.</td></tr>
  </table></div>
  <div class="box"><p class="key">Pourquoi le « je » rend le récit fantastique</p><ul><li>On a l'impression que c'est <b>vrai</b> (des dates, au jour le jour).</li><li>On <b>ressent</b> ce que ressent le narrateur.</li><li>On ne voit <b>que ce qu'il voit</b>. Personne d'autre ne peut nous dire ce qui se passe vraiment : on <b>doute</b> jusqu'au bout.</li></ul></div></div>
 <div class="fsec"><h3>2. Le début : l'entrée du 8 mai</h3>
  <p>Le narrateur n'est <b>pas</b> triste ni nostalgique. Il est <b>heureux</b>, plein de joie, en harmonie avec sa région.</p>
  <div class="two">
   <div class="box"><p class="key">Phrases exclamatives</p><p>« Quelle journée admirable ! »<br>« Comme il faisait beau, ce matin ! »</p><p>→ montrent son enthousiasme.</p></div>
   <div class="box"><p class="key">Énumération</p><p>Les racines qui l'attachent « aux usages comme aux nourritures, aux locutions locales, aux intonations des paysans, aux odeurs du sol… »</p><p>→ montre qu'il est lié à sa terre par tous ses sens.</p></div>
  </div>
  <p class="tip">Pourquoi commencer par le bonheur ? Plus le début est heureux, plus la chute vers la peur et la folie sera forte.</p></div>
 <div class="fsec"><h3>3. La méthode pour analyser un texte</h3>
  <div class="flow"><div class="st"><b>1. Je nomme</b> le procédé : phrase exclamative, énumération, champ lexical, comparaison…</div><div class="ar">↓</div><div class="st"><b>2. Je cite</b> le texte entre guillemets.</div><div class="ar">↓</div><div class="st"><b>3. J'explique</b> l'effet : ce que ça montre, ce que ça fait ressentir.</div></div>
  <div class="box"><p><b>Exemple :</b> Le narrateur utilise une <b>phrase exclamative</b>, « Quelle journée admirable ! », qui <b>montre</b> sa joie et son enthousiasme.</p></div>
  <p class="tip">Règle de la professeure : en analyse, on écrit des <b>phrases complètes</b>. Les tirets et les listes sont interdits au contrôle.</p></div>
 <div class="fsec"><h3>4. La scène de Lénore (Edgar Allan Poe)</h3>
  <div class="two">
   <div class="box"><p class="key">Imparfait = le décor</p><ul><li>« Pendant que je <b>méditais</b> » (ça dure)</li><li>« je <b>donnais</b> de la tête » (il s'endort)</li><li>chaque tison <b>brodait</b> le plancher</li></ul></div>
   <div class="box"><p class="key">Passé simple = l'action</p><ul><li>« <b>soudain</b> », on frappe à la porte</li><li>« je me <b>dressai</b> », « j'<b>ouvris</b> la porte »</li><li>le couloir est vide : c'est l'étrange</li></ul></div>
  </div>
  <p><b>Les 2 explications</b> : rationnelle (le vent, un rêve, il s'endormait, du somnambulisme) ou surnaturelle (le fantôme de Lénore, une femme aimée et disparue).</p>
  <p><b>Minuit</b> (« minuit lugubre ») et <b>décembre</b> (froid, nuit, mort) : on voit mal, on se sent fragile, on a peur.</p>
  <p class="tip">Astuce : « soudain » appelle le passé simple. Attention à l'oreille : « je désirerai » (futur) ≠ « je désirais » (imparfait).</p></div>`},
{id:"an-dill",s:"Anglais",t:"John Dillinger et décrire une photo",src:"Cours du 4 novembre · à présenter le jeudi 5",
 lumni:[["La Prohibition et les gangsters",LUMNI("prohibition")],["Décrire une image en anglais",LUMNI("describe a picture")]],
 short:[
  "Décrire : <b>It shows a man wearing a suit, a shirt and a tie.</b> He has <b>short, straight hair</b>.",
  "Impression : <b>He looks</b> serious / rich / smart (élégant) / dangerous. <b>He looks like</b> a businessman / a villain.",
  "Ce que je vois (observation) ≠ ce que je suppose (interprétation).",
  "<b>John Dillinger</b> : a famous <b>bank robber</b>, « Public Enemy Number One ». He <b>was born on</b> June 22nd, 1903, in Indianapolis, Indiana.",
  "<b>rob</b> a bank (braquer un lieu) ≠ <b>steal</b> money (voler une chose). FBI = Federal Bureau of Investigation : it investigates and catches criminals."],
 full:`
 <div class="fsec"><h3>1. Décrire une photo</h3>
  <div class="two">
   <div class="box"><p class="key">Ce que je vois</p><p><b>It shows a man wearing</b> a suit (costume), a shirt (chemise) and a tie (cravate).</p><p>He has <b>short</b> (courts), <b>straight</b> (lisses) hair.</p></div>
   <div class="box"><p class="key">L'impression qu'il donne</p><p><b>He looks</b> + adjectif : serious, rich, smart (= élégant ici), angry, dangerous.</p><p><b>He looks like</b> + nom : a businessman, a villain (un méchant).</p></div>
  </div>
  <p class="tip"><b>Observation ≠ interprétation.</b> « He wears a tie » : je le vois. « He looks like a gangster » : je le suppose. Avec un numéro sur la photo, on peut supposer : <b>He has just been arrested</b> (il vient d'être arrêté).</p></div>
 <div class="fsec"><h3>2. John Dillinger, d'après la vidéo</h3>
  <div class="flow">
   <div class="st"><b>Who?</b> One of the most famous American <b>bank robbers</b>. Nickname: <b>Public Enemy Number One</b>. « The rock star of gangsters » = very famous, and violent.</div><div class="ar">↓</div>
   <div class="st"><b>Born</b> : <b>He was born on June 22nd, 1903, in Indianapolis, Indiana</b> (USA).</div><div class="ar">↓</div>
   <div class="st">In his twenties, he robbed a <b>grocery</b> (une épicerie). He was <b>arrested</b> and <b>convicted</b> (reconnu coupable) and went to <b>prison</b>.</div><div class="ar">↓</div>
   <div class="st">In prison, he met other criminals. When he got out, he <b>formed a gang</b>.</div><div class="ar">↓</div>
   <div class="st">The gang robbed <b>police arsenals</b> (to get guns), then <b>banks</b> for three months in the <b>Midwest</b>. They were arrested in <b>Tucson, Arizona</b>.</div>
  </div></div>
 <div class="fsec"><h3>3. Les mots à ne pas confondre</h3>
  <div class="table-wrap"><table><tr><th>Anglais</th><th>Sens</th><th>Exemple</th></tr>
   <tr><td><b>rob</b> – robbed</td><td>braquer (un lieu, une personne)</td><td>He robbed banks.</td></tr>
   <tr><td><b>steal</b> – stole – stolen</td><td>voler (une chose)</td><td>He stole money.</td></tr>
   <tr><td>a bank robber</td><td>un braqueur de banques</td><td>He was a bank robber.</td></tr>
   <tr><td>to catch – caught</td><td>attraper</td><td>The FBI wanted to catch him.</td></tr>
   <tr><td><b>FBI</b></td><td>Federal Bureau of Investigation</td><td>It investigates : it looks for clues and evidence to arrest criminals.</td></tr>
  </table></div></div>
 <div class="fsec"><h3>4. Pour comprendre une vidéo rapide</h3>
  <p>Je ne cherche pas à comprendre chaque mot. Je note les <b>mots-clés</b> que je reconnais : un nom, une date, un lieu, un verbe. Ensuite je fais des phrases avec.</p>
  <p class="tip">Cahier : la feuille de remédiation se colle <b>juste après</b> le travail concerné, pas à la fin du cahier, avec de la colle sur la tranche seulement.</p></div>`}
);

 <div class="fsec"><h3>2. Fréquences : l'exercice des 48 élèves</h3>

 <div class="fsec"><h3>1. Deux mots à ne pas confondre</h3>
  <div class="two">

  </div>
  <p>Dans la Déclaration de 1789, « <b>Homme</b> » avec une majuscule veut dire <b>tous les êtres humains</b>, femmes comprises.</p></div>
 <div class="fsec"><h3>2. L'anonymat sur Internet n'existe pas vraiment</h3>
  <ul><li>Chaque connexion envoie une <b>adresse IP</b> : le numéro de l'appareil ou du réseau.</li><li>Un faux nom, c'est un <b>pseudonyme</b>, pas l'anonymat.</li><li>La <b>navigation privée</b> efface l'historique sur MON ordinateur, mais les sites et le fournisseur d'accès voient quand même.</li></ul>
  <div class="box"><p class="key">Ce qui limite le traçage</p><ul><li>refuser les <b>cookies</b> (petits fichiers qui suivent ma navigation) ;</li><li>couper la <b>géolocalisation</b> du téléphone ;</li><li>utiliser un moteur de recherche européen (Qwant).</li></ul></div>
  <p>Les grandes entreprises lisent nos recherches et nos messages pour faire de la <b>publicité ciblée</b>. Accepter les <b>CGU</b> (conditions d'utilisation) sans les lire, c'est accepter ça.</p></div>
 <div class="fsec"><h3>3. Protéger sa vie privée</h3>

  <p>La <b>CNIL</b> (Commission nationale de l'informatique et des libertés) veille à ce que l'informatique respecte la vie privée et les libertés en France.</p></div>
 <div class="fsec"><h3>4. Le droit à l'oubli</h3>
  <p>On peut demander qu'une information <b>fausse, ancienne ou blessante</b> soit retirée d'Internet. Exemple : <b>Léonard</b>, accusé à tort de vol, que les moteurs de recherche associaient à ce vol.</p>
  <p><b>Limite</b> : on ne peut pas effacer des faits d'<b>intérêt public</b>, comme le passé d'un responsable politique, car les citoyens ont le droit d'être informés.</p>
  <p class="tip">Au cahier : surligner les définitions du tableau. Les évaluations d'histoire se collent dans le cahier d'<b>histoire</b>, pas dans celui d'EMC.</p></div>`}

{id:"ma-med",s:"Maths",t:"La médiane",src:"Cours du 6 novembre (Hugo absent à ce cours) · exercices p. 160 pour lundi",

 short:[
  "La <b>médiane</b> partage la série en <b>deux moitiés</b> : au moins la moitié des valeurs sont <b>inférieures ou égales</b>, au moins la moitié sont <b>supérieures ou égales</b>.",
  "Méthode : 1. je <b>range</b> les valeurs dans l'ordre croissant ; 2. je compte <b>N</b> ; 3. je trouve la valeur du <b>milieu</b>.",
  "<b>N impair</b> : la médiane est la valeur au rang <b>(N + 1) ÷ 2</b>. Ex : 3 ; 7 ; <b>8</b> ; 12 ; 15 → 8.",
  "<b>N pair</b> : la médiane est la <b>moyenne des deux valeurs du milieu</b> (rangs N ÷ 2 et N ÷ 2 + 1). Ex : 2 ; 5 ; <b>6 ; 9</b> ; 11 ; 14 → (6 + 9) ÷ 2 = 7,5.",
  "Médiane ≠ moyenne. L'<b>étendue</b> = plus grande valeur − plus petite (pas demandée cette fois)."],
 full:`
 <div class="fsec"><h3>1. À quoi sert la médiane ?</h3>
  <p>La moyenne résume une série par un seul nombre, mais une valeur très grande ou très petite peut la tirer d'un côté. La <b>médiane</b>, elle, est la valeur <b>du milieu</b> : elle coupe la série en <b>deux moitiés</b>.</p>
  <div class="box"><p class="key">Définition</p><p>La médiane est un nombre tel qu'<b>au moins la moitié</b> des valeurs lui sont <b>inférieures ou égales</b> et <b>au moins la moitié</b> lui sont <b>supérieures ou égales</b>.</p></div></div>
 <div class="fsec"><h3>2. La méthode en 3 étapes</h3>
  <div class="flow"><div class="st"><b>1. Je range</b> toutes les valeurs dans l'ordre croissant (de la plus petite à la plus grande). Je barre chaque valeur recopiée pour n'en oublier aucune.</div><div class="ar">↓</div><div class="st"><b>2. Je compte</b> le nombre de valeurs : N.</div><div class="ar">↓</div><div class="st"><b>3. Je trouve le milieu</b> : N impair ou N pair ?</div></div>
  <div class="two">
   <div class="box"><p class="key">N impair</p><p>La médiane est la valeur au rang <b>(N + 1) ÷ 2</b>.</p><p>Notes : 15 ; 8 ; 12 ; 3 ; 7<br>Rangées : 3 ; 7 ; <b>8</b> ; 12 ; 15<br>N = 5, rang (5 + 1) ÷ 2 = 3<br>Médiane = <b>8</b></p></div>
   <div class="box"><p class="key">N pair</p><p>La médiane est la <b>moyenne des deux valeurs du milieu</b> (rangs N ÷ 2 et N ÷ 2 + 1).</p><p>Rangées : 2 ; 5 ; <b>6</b> ; <b>9</b> ; 11 ; 14<br>N = 6, rangs 3 et 4<br>Médiane = (6 + 9) ÷ 2 = <b>7,5</b></p></div>
  </div>
  <p class="tip">Piège : on ne prend jamais le milieu d'une liste <b>pas rangée</b>. Toujours ranger d'abord.</p></div>
 <div class="fsec"><h3>3. Avec un tableau d'effectifs</h3>
  <p>Exemple du cours : les 28 élèves et leurs frères et sœurs (0 → 6, 1 → 7, 2 → 7, 3 → 4, 4 → 3, 5 → 1).</p>
  <ul><li>N = 28 est pair : je cherche les valeurs aux rangs <b>14</b> et <b>15</b>.</li><li>Je compte les effectifs : la valeur 0 occupe les rangs 1 à 6, la valeur 1 les rangs 7 à 13, la valeur 2 les rangs 14 à 20.</li><li>Les rangs 14 et 15 valent tous les deux 2 : la médiane est <b>2</b>.</li></ul>
  <p>Pour comparer : la moyenne de cette série est ≈ 1,79. Médiane et moyenne sont souvent différentes.</p>
  <p class="tip">Pour les exercices p. 160 : l'<b>étendue</b> (plus grande valeur − plus petite valeur) n'est <b>pas</b> demandée. Exercice 4 : seulement les questions 1 et 2.</p></div>`},

 full:`

  <div class="table-wrap"><table><tr><th>Heure</th><th>Espagnol</th></tr>
   <tr><td>1 h</td><td><b>Es</b> la una</td></tr><tr><td>2 h</td><td><b>Son</b> las dos</td></tr><tr><td>3 h 15</td><td>Son las tres <b>y cuarto</b></td></tr><tr><td>4 h 30</td><td>Son las cuatro <b>y media</b></td></tr><tr><td>4 h 45</td><td>Son las cinco <b>menos cuarto</b></td></tr><tr><td>à 8 h du matin</td><td><b>a las</b> ocho de la mañana</td></tr><tr><td>de l'après-midi / du soir</td><td>de la tarde / de la noche</td></tr></table></div>
  <p class="tip">« Es la una » au singulier (une seule heure), « son las… » pour toutes les autres.</p></div>
 <div class="fsec"><h3>2. Ma routine (yo)</h3>
  <div class="table-wrap"><table><tr><th>Espagnol</th><th>Français</th></tr>
   <tr><td>me despierto</td><td>je me réveille</td></tr><tr><td>me levanto</td><td>je me lève</td></tr><tr><td>me ducho</td><td>je me douche</td></tr><tr><td>me visto</td><td>je m'habille</td></tr><tr><td>desayuno</td><td>je prends le petit-déjeuner</td></tr><tr><td>voy al colegio</td><td>je vais au collège</td></tr><tr><td>como</td><td>je déjeune</td></tr><tr><td>vuelvo a casa</td><td>je rentre à la maison</td></tr><tr><td>hago los deberes</td><td>je fais mes devoirs</td></tr><tr><td>ceno</td><td>je dîne</td></tr><tr><td>me acuesto</td><td>je me couche</td></tr></table></div>
  <div class="box"><p>Me levanto <b>a las siete</b>. Desayuno <b>a las siete y media</b>. Me acuesto <b>a las diez</b>.</p></div></div>

 <div class="fsec"><h3>4. Comparer</h3>

  <div class="box"><p class="key">Vu au tableau le 6 novembre : se + 3e personne = « on »</p><p>En España <b>se hace</b> todo más tarde. En España <b>se suele hacer</b> todo más tarde.</p><p>En España <b>se juega</b> un derbi a las…, <b>mientras que</b> en Inglaterra se juega un derbi a las…</p><p>Los españoles suelen desayunar a las 8 de la mañana, <b>sin embargo</b>, los ingleses suelen desayunar a las 7:30.</p></div>
  <p class="tip">Lundi, questions à l'oral puis début du projet final. Vérifie aussi le vocabulaire de ton cahier : c'est la liste de la professeure qui compte.</p></div>`}

  <p class="tip">Compare avec ton bilan 4 collé dans le cahier : c'est lui qui compte pour l'évaluation.</p></div>`;

 med.short.push("<b>Étendue</b> (cours du 9 nov.) = plus grande valeur − plus petite valeur. Elle mesure l'écart entre les extrêmes.");

FICHES.push(
{id:"fr-mots",s:"Français",t:"Le Horla (12 mai) et la formation des mots",src:"Séance 4 du 10 novembre · exercice pour le jeudi 12",
 lumni:[["Préfixes et suffixes",LUMNI("préfixe suffixe")]],
 short:[
  "Le 12 mai, le narrateur a « un peu de fièvre » : le thème de la <b>maladie</b> apparaît. C'est une des explications possibles (rationnelle).",
  "Les <b>phrases interrogatives</b> montrent qu'il ne comprend pas ce qui lui arrive. Le texte évoque les <b>5 sens</b>, trop faibles pour percevoir le surnaturel.",
  "Un mot = <b>préfixe</b> (avant) + <b>radical</b> (le cœur du mot) + <b>suffixe</b> (après). in-vis-ible = qu'on ne peut pas voir.",
  "Mots de la même famille : même radical. école → écolier, scolaire, scolarité, déscolariser."],
 full:`
 <div class="fsec"><h3>1. L'entrée du 12 mai : « J'ai un peu de fièvre »</h3>
  <ul><li>Après le bonheur du 8 mai, le narrateur se sent <b>malade</b>. La maladie devient une <b>explication possible</b> de ce qui va arriver (explication rationnelle).</li><li>Il pose beaucoup de <b>questions</b> (phrases interrogatives) : il ne comprend pas son état.</li><li>Le texte parle des <b>5 sens</b> (vue, ouïe, odorat, toucher, goût) pour montrer qu'ils ne suffisent pas à percevoir certaines choses <b>surnaturelles</b>.</li></ul></div>
 <div class="fsec"><h3>2. Comment un mot est formé</h3>
  <div class="flow"><div class="st"><b>Préfixe</b> : placé <b>avant</b> le radical. Il change le sens (in- = pas, re- = de nouveau, dé- = le contraire).</div><div class="ar">↓</div><div class="st"><b>Radical</b> : le <b>cœur</b> du mot, qui porte le sens principal.</div><div class="ar">↓</div><div class="st"><b>Suffixe</b> : placé <b>après</b> le radical. Il change souvent la classe du mot (-able, -ible : adjectif ; -tion, -age : nom ; -ir : verbe).</div></div>
  <div class="table-wrap"><table><tr><th>Mot</th><th>Préfixe</th><th>Radical</th><th>Suffixe</th><th>Sens</th></tr>
   <tr><td>invisible</td><td>in-</td><td>vis</td><td>-ible</td><td>qu'on ne peut pas voir</td></tr>
   <tr><td>inconnaissable</td><td>in-</td><td>connaiss</td><td>-able</td><td>qu'on ne peut pas connaître</td></tr></table></div>
  <p class="tip">Méthode pour l'exercice de jeudi (« mystérieuses », « voisinages », « assombri », « misérables », « vibrations ») : 1. je cherche un mot plus simple de la même famille (le radical) ; 2. ce qui est avant = préfixe ; 3. ce qui est après = suffixe. Un mot n'a pas toujours de préfixe.</p></div>`},
{id:"pc-tension",s:"Physique-Chimie",t:"La tension électrique",src:"Chapitre 2 · cours du 10 novembre",
 lumni:[["La tension électrique",LUMNI("tension électrique")],["Utiliser un voltmètre",LUMNI("voltmètre")]],
 short:[
  "La <b>tension</b> se note <b>U</b>, son unité est le <b>volt (V)</b>.",
  "On la mesure avec un <b>voltmètre</b> branché <b>en dérivation</b> (aux bornes du dipôle), borne <b>V</b> et borne <b>COM</b>.",
  "Il existe <b>toujours</b> une tension aux bornes d'un <b>générateur</b>, même seul.",
  "Interrupteur <b>ouvert</b> : tension <b>non nulle</b> mais pas de courant. Interrupteur <b>fermé</b> ou fil : tension <b>nulle</b> même avec du courant."],
 full:`
 <div class="fsec"><h3>1. Généralités</h3>
  <div class="box"><p class="key">La tension électrique</p><p>Symbole : <b>U</b>. Unité : le <b>volt</b>, symbole <b>V</b>. Une pile « 4,5 V » a une tension de 4,5 volts à ses bornes.</p></div></div>
 <div class="fsec"><h3>2. La mesurer avec un voltmètre</h3>
  <ul><li>Le voltmètre se branche <b>en dérivation</b> : ses deux fils vont <b>de part et d'autre</b> du dipôle (aux deux bornes), sans ouvrir le circuit.</li><li>On utilise les bornes <b>V</b> et <b>COM</b> du multimètre, sur le calibre « V ».</li></ul>
  <p class="tip">Ne pas confondre : l'ampèremètre (intensité) se branche en <b>série</b> ; le voltmètre (tension) en <b>dérivation</b>.</p></div>
 <div class="fsec"><h3>3. Les conclusions de l'activité 1</h3>
  <div class="table-wrap"><table><tr><th>Dipôle</th><th>Courant ?</th><th>Tension à ses bornes</th></tr>
   <tr><td>Pile, générateur (seul ou dans un circuit)</td><td>oui ou non</td><td><b>toujours</b> une tension</td></tr>
   <tr><td>Interrupteur <b>ouvert</b></td><td>non</td><td>tension <b>non nulle</b></td></tr>
   <tr><td>Interrupteur <b>fermé</b>, fil de connexion</td><td>oui</td><td>tension <b>nulle</b></td></tr></table></div>
  <p>À retenir : une tension peut exister <b>sans courant</b>, et un courant peut passer <b>sans tension</b> aux bornes d'un fil ou d'un interrupteur fermé.</p></div>`},
{id:"emc-etat",s:"Histoire-Géo-EMC",t:"L'État de droit et l'ordre public",src:"EMC · leçon à finir de rédiger pour le vendredi 13",
 lumni:[["L'État de droit",LUMNI("état de droit")]],
 short:[
  "<b>État de droit</b> : un État où <b>tout le monde</b>, y compris les dirigeants, doit <b>respecter la loi</b>.",
  "Ses piliers : la <b>Constitution</b> au-dessus des lois, la <b>séparation des pouvoirs</b> (législatif, exécutif, judiciaire), une <b>justice indépendante</b>, les <b>droits fondamentaux</b> garantis.",
  "L'<b>ordre public</b> (sécurité, tranquillité) est assuré par la police et la justice, mais <b>dans le respect des lois</b> et des libertés."],
 full:`
 <div class="fsec"><h3>II. Assurer l'ordre public dans un État de droit</h3>
  <p class="tip">Ta leçon a été construite en classe par les élèves : cette fiche t'aide à la compléter. Vérifie avec tes notes et la correction de la fiche 3.</p>
  <div class="box"><p class="key">A) Qu'est-ce que l'État de droit ?</p><p>C'est un État dans lequel le <b>pouvoir est soumis au droit</b> : les lois s'appliquent à <b>tous</b>, aux citoyens comme aux gouvernants. Personne n'est au-dessus des lois.</p></div>
  <ul><li>La <b>Constitution</b> est la règle la plus haute : les lois doivent la respecter.</li><li>Les <b>pouvoirs sont séparés</b> : faire les lois (Parlement), les appliquer (gouvernement), juger (justice). C'est l'idée de Montesquieu, vue avec les Lumières.</li><li>La <b>justice est indépendante</b> : chacun a droit à un procès équitable.</li><li>Les <b>droits et libertés</b> (Déclaration de 1789) sont garantis.</li></ul>
  <p><b>Ordre public</b> : la sécurité et la tranquillité de tous. La police et la justice le protègent, mais elles doivent elles aussi <b>respecter la loi</b> : c'est la différence avec un État où le pouvoir fait ce qu'il veut (despotisme, lettre de cachet).</p></div>`},
{id:"an-hopper",s:"Anglais",t:"Décrire un tableau (Edward Hopper)",src:"Renforcement · évaluation du 6 novembre (3,5/20)",
 lumni:[["Edward Hopper",LUMNI("Edward Hopper")],["Décrire une image en anglais",LUMNI("describe a picture")]],
 short:[
  "4 étapes : <b>1. Je présente</b> (This painting is by Edward Hopper. It's called…) <b>2. Je décris</b> (In the foreground… there is…) <b>3. Je fais des hypothèses</b> (She may/might/must…) <b>4. Je donne mon avis</b> (I like it because…).",
  "Où : <b>in the foreground</b> (au premier plan), <b>in the background</b> (à l'arrière-plan), <b>in the middle</b>, <b>on the left / on the right</b>.",
  "Ce qui se passe : présent <b>be + -ing</b> : A woman <b>is sitting</b> at a table.",
  "Hypothèses : <b>may / might</b> (peut-être), <b>must</b> (sûrement) + verbe : She <b>may be waiting</b> for someone. She <b>must be</b> sad."],
 full:`
 <div class="fsec"><h3>La méthode en 4 étapes</h3>
  <div class="flow">
   <div class="st"><b>1. Présenter</b> : This painting is by <b>Edward Hopper</b>, an American painter. It's called <i>Automat</i>. It was painted in 1927.</div><div class="ar">↓</div>
   <div class="st"><b>2. Décrire</b> (où + quoi) : In the foreground, <b>there is</b> a woman. In the background, <b>there are</b> lights in the window.</div><div class="ar">↓</div>
   <div class="st"><b>3. Ce qui se passe</b> (be + -ing) : She <b>is sitting</b> alone at a table. She <b>is holding</b> a cup of coffee. She <b>is wearing</b> a coat and a hat.</div><div class="ar">↓</div>
   <div class="st"><b>4. Hypothèses et avis</b> : It <b>must be</b> night. She <b>may be waiting</b> for someone. She <b>might be</b> sad or lonely. I like this painting because…</div>
  </div></div>
 <div class="fsec"><h3>Les mots pour se repérer</h3>
  <div class="table-wrap"><table><tr><th>Anglais</th><th>Français</th></tr>
   <tr><td>in the foreground</td><td>au premier plan</td></tr><tr><td>in the background</td><td>à l'arrière-plan</td></tr><tr><td>in the middle / in the centre</td><td>au milieu</td></tr><tr><td>on the left / on the right</td><td>à gauche / à droite</td></tr><tr><td>at the top / at the bottom</td><td>en haut / en bas</td></tr><tr><td>next to / behind / in front of</td><td>à côté de / derrière / devant</td></tr></table></div></div>
 <div class="fsec"><h3>Modaux : quand je ne suis pas sûr</h3>
  <ul><li><b>must</b> + verbe = j'en suis presque sûr : It <b>must be</b> cold.</li><li><b>may</b> / <b>might</b> + verbe = c'est possible : She <b>might be</b> tired.</li></ul>
  <p class="tip">Toujours le verbe de base après must / may / might (pas de -s, pas de to).</p></div>`},
{id:"fr-ps",s:"Français",t:"Conjuguer au passé simple",src:"Renforcement · contrôle du 9 octobre (3/10)",
 lumni:[["Le passé simple",LUMNI("passé simple")]],
 short:[
  "Verbes en <b>-er</b> (et aller) : -ai, -as, -a, -âmes, -âtes, -<b>èrent</b>. il chanta, ils chantèrent.",
  "Verbes en <b>-ir</b> et beaucoup d'autres : -is, -is, -it, -îmes, -îtes, -<b>irent</b>. il finit, il fit, il prit, il dit, il vit.",
  "D'autres en <b>-us</b> : il eut, il fut, il sut, il put, il voulut, il lut, il but, il courut, il mourut.",
  "venir, tenir : il <b>vint</b>, ils <b>vinrent</b> ; il <b>tint</b>.",
  "Accent circonflexe à <b>nous</b> et <b>vous</b> : nous chantâmes, vous fîtes."],
 full:`
 <div class="fsec"><h3>Les 4 familles de terminaisons</h3>
  <div class="table-wrap"><table><tr><th></th><th>-a (chanter)</th><th>-i (finir, faire)</th><th>-u (courir, être)</th><th>-in (venir)</th></tr>
   <tr><td>je</td><td>chantai</td><td>finis</td><td>courus</td><td>vins</td></tr>
   <tr><td>tu</td><td>chantas</td><td>finis</td><td>courus</td><td>vins</td></tr>
   <tr><td>il / elle</td><td>chanta</td><td>finit</td><td>courut</td><td>vint</td></tr>
   <tr><td>nous</td><td>chantâmes</td><td>finîmes</td><td>courûmes</td><td>vînmes</td></tr>
   <tr><td>vous</td><td>chantâtes</td><td>finîtes</td><td>courûtes</td><td>vîntes</td></tr>
   <tr><td>ils / elles</td><td>chantèrent</td><td>finirent</td><td>coururent</td><td>vinrent</td></tr></table></div></div>
 <div class="fsec"><h3>Les verbes à connaître par cœur (3e personne)</h3>
  <div class="two">
   <div class="box"><p class="key">en -i</p><p>faire → il fit · dire → il dit · prendre → il prit · mettre → il mit · voir → il vit · écrire → il écrivit · peindre → il peignit · craindre → il craignit · vaincre → il vainquit · rire → il rit · suivre → il suivit</p></div>
   <div class="box"><p class="key">en -u</p><p>être → il fut · avoir → il eut · savoir → il sut · pouvoir → il put · vouloir → il voulut · lire → il lut · boire → il but · courir → il courut · mourir → il mourut · résoudre → il résolut · décevoir → il déçut</p></div>
  </div>
  <p class="tip">Piège : aller fait <b>il alla</b> (comme les verbes en -er). Les verbes en -er ont toujours <b>-èrent</b> au pluriel, jamais -irent.</p></div>`},
{id:"pc-vitesse",s:"Physique-Chimie",t:"Mouvement et vitesse",src:"Renforcement · contrôle n°1 du 7 octobre (7,5/20) et TP vitesses (2/10)",
 lumni:[["La vitesse",LUMNI("calculer une vitesse")]],
 short:[
  "<b>v = d ÷ t</b> : vitesse = distance ÷ durée. En m/s (mètres et secondes) ou en km/h (kilomètres et heures).",
  "1 m/s = 3,6 km/h. Pour passer de m/s à km/h : × 3,6.",
  "<b>Trajectoire</b> : le chemin suivi (rectiligne = droite, circulaire = cercle, curviligne = courbe).",
  "Mouvement <b>uniforme</b> (vitesse constante : points également espacés), <b>accéléré</b> (écarts qui grandissent), <b>ralenti</b> (écarts qui diminuent)."],
 full:`
 <div class="fsec"><h3>1. Calculer une vitesse</h3>
  <div class="box"><p class="mem">v = d ÷ t</p><p>Une goutte parcourt 0,60 m en 2 s : v = 0,60 ÷ 2 = <b>0,30 m/s</b>.</p><p>Une voiture parcourt 150 km en 2 h : v = 150 ÷ 2 = <b>75 km/h</b>.</p></div>
  <p class="tip">Les unités vont ensemble : mètres et secondes → m/s ; kilomètres et heures → km/h. 1 m/s = 3,6 km/h.</p></div>
 <div class="fsec"><h3>2. Décrire un mouvement</h3>
  <ul><li><b>Trajectoire</b> : rectiligne (en ligne droite), circulaire (en cercle), curviligne (en courbe).</li><li><b>Vitesse</b> : <b>uniforme</b> si elle ne change pas, <b>accélérée</b> si elle augmente, <b>ralentie</b> si elle diminue.</li><li>Sur une <b>chronophotographie</b> (positions à intervalles de temps égaux) : écarts égaux → uniforme ; écarts qui grandissent → accéléré ; écarts qui diminuent → ralenti.</li></ul>
  <p class="tip">Le sujet exact du contrôle n°1 n'est pas sur Pronote : regarde ta copie avec maman pour voir quelles questions ont été ratées.</p></div>`},
{id:"ma-base",s:"Maths",t:"Bases à reprendre : arithmétique et Pythagore",src:"Renforcement · interrogation du 6 oct. (3,5/10), évaluations du 22 sept. (6/15) et du 15 oct. (10/20)",
 lumni:[["Les nombres premiers",LUMNI("nombres premiers")],["Le théorème de Pythagore",LUMNI("théorème de Pythagore")]],
 short:[
  "<b>Nombre premier</b> : il a exactement <b>deux diviseurs</b>, 1 et lui-même (2, 3, 5, 7, 11, 13…). 1 n'est pas premier.",
  "Divisible par <b>2</b> : finit par 0, 2, 4, 6, 8 · par <b>3</b> : somme des chiffres divisible par 3 · par <b>4</b> : les 2 derniers chiffres forment un multiple de 4 · par <b>5</b> : finit par 0 ou 5 · par <b>9</b> : somme des chiffres divisible par 9.",
  "Divisible par 12 = divisible par 3 <b>et</b> par 4.",
  "<b>Pythagore</b> : dans un triangle rectangle, hypoténuse² = côté² + côté². L'hypoténuse est le côté <b>en face de l'angle droit</b>.",
  "Vrai ou faux : pour dire « faux », un seul <b>contre-exemple</b> suffit (3 + 5 = 8 n'est pas premier)."],
 full:`
 <div class="fsec"><h3>1. Diviseurs et nombres premiers</h3>
  <div class="box"><p class="key">Trouver tous les diviseurs de 56</p><p>Je cherche les paires qui donnent 56 : 1 × 56, 2 × 28, 4 × 14, 7 × 8.</p><p>Diviseurs : <b>1 ; 2 ; 4 ; 7 ; 8 ; 14 ; 28 ; 56</b>.</p></div>
  <ul><li>Nombre <b>premier</b> : exactement deux diviseurs, 1 et lui-même. 63 = 7 × 9, donc 63 <b>n'est pas</b> premier.</li><li>156 : 1 + 5 + 6 = 12, divisible par 3 → 156 <b>est</b> divisible par 3.</li><li>386 : 3 + 8 + 6 = 17, pas divisible par 3 → 386 <b>n'est pas</b> divisible par 12.</li></ul></div>
 <div class="fsec"><h3>2. Le théorème de Pythagore</h3>
  <div class="box"><p class="mem">hypoténuse² = côté² + côté²</p><p>ABC rectangle en <b>B</b> : l'hypoténuse est <b>AC</b> (en face de B).</p><p>AC² = AB² + BC² → 9² = 4² + BC² → BC² = 81 − 16 = 65 → BC = √65 ≈ <b>8,1 cm</b>.</p></div>
  <p class="tip">Rédaction attendue : « Le triangle ABC est rectangle en B, donc d'après le théorème de Pythagore : AC² = AB² + BC². » Puis le calcul ligne par ligne.</p></div>
 <div class="fsec"><h3>3. Relatifs : additionner et soustraire</h3>
  <p>(+6) + (−8) = −2 · (−5,7) + (−4,8) = −10,5 · (−4,5) − (−3) = −4,5 + 3 = −1,5. Soustraire un nombre, c'est <b>ajouter son opposé</b>.</p></div>`},
{id:"an-basics",s:"Anglais",t:"Jours, mois et anglais de la classe",src:"Renforcement · évaluations de septembre (2/10, 4/17, 5,5/13)",
 lumni:[["Les jours et les mois en anglais",LUMNI("jours mois anglais")]],

 full:`
 <div class="fsec"><h3>Les jours et les mois</h3>
  <div class="two"><div class="box"><p class="key">Days</p><p>Monday · Tuesday · Wednesday · Thursday · Friday · Saturday · Sunday</p></div><div class="box"><p class="key">Months</p><p>January · February · March · April · May · June · July · August · September · October · November · December</p></div></div>
  <p class="tip">En anglais, les jours et les mois prennent toujours une <b>majuscule</b>. La date : <b>on</b> Monday, <b>in</b> November, <b>on</b> November 11th.</p></div>
 <div class="fsec"><h3>Classroom English</h3>

);

const attempts=qid=>S.quiz[qid]||[];
const exAtt=id=>S.ex[id]||[];
function lastPct(qid){const a=attempts(qid);return a.length?a[a.length-1].score/a[a.length-1].total:null;}
function exLast(id){const a=exAtt(id);return a.length?a[a.length-1].score/a[a.length-1].total:null;}
function daysPlayed(qid){return new Set(attempts(qid).filter(x=>x.score/x.total>=.8).map(x=>x.d)).size;}
function pillPct(p,label){ if(p===null) return '<span class="pill n">pas encore fait</span>'; const c=p>=.8?"g":p>=.6?"o":"r"; return '<span class="pill '+c+'">'+label+'</span>'; }
function pillQ(qid){const a=attempts(qid); if(!a.length) return pillPct(null); const l=a[a.length-1]; return pillPct(l.score/l.total,"dernier : "+l.score+"/"+l.total);}
function pillE(id){const a=exAtt(id); if(!a.length) return pillPct(null); const l=a[a.length-1]; return pillPct(l.score/l.total,l.score+"/"+l.total);}
function readiness(c){
  const ch=S.checks[c.id]||{}; const nCh=c.cl.filter((_,i)=>ch[i]).length;
  const miss=[]; let level="g"; const down=l=>{ if(l==="r") level="r"; else if(level==="g") level="o"; };
  c.quiz.forEach(q=>{const l=lastPct(q);
    if(l===null){miss.push("faire le quiz « "+QI(q).t+" »"); down("r");}
    else if(l<.6){miss.push("refaire le quiz « "+QI(q).t+" » (moins de 60 %)"); down("r");}
    else if(l<.8){miss.push("atteindre 80 % au quiz « "+QI(q).t+" »"); down("o");}
    else if(daysPlayed(q)<2){miss.push("réussir le quiz encore une fois, un autre jour"); down("o");} });
  (c.ex||[]).forEach(e=>{const l=exLast(e); if(l===null){miss.push("faire l'entraînement « "+EI(e).t+" »"); down("o");} else if(l<.8){miss.push("refaire l'entraînement « "+EI(e).t+" »"); down("o");} });
  if(nCh<c.cl.length){miss.push("cocher "+(c.cl.length-nCh)+" case(s) « je sais »"); down("o");}
  if(nCh===0&&c.quiz.every(q=>lastPct(q)===null)) level="r";
  return {level,miss};
}

/* ---- Entraînement ---- */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=()=>{let n=0;while(!n)n=rnd(-9,9);return n;};
const P=n=>n<0?"(−"+(-n)+")":String(n);
const N=n=>{const s=String(Math.round(n*100)/100).replace(".",",");return s.startsWith("-")?"−"+s.slice(1):s;};
function genRel(){
  const t=rnd(0,5); let a=nz(),b=nz(),c=nz(),q,ans,ex;
  if(t===0){q=N(a)+" × "+P(b);ans=a*b;ex=(a*b<0?"Signes différents → négatif.":"Signes pareils → positif.");}
  else if(t===1){q=N(a)+" + "+P(b);ans=a+b;ex=(Math.sign(a)===Math.sign(b)?"Même signe : j'additionne et je garde le signe.":"Signes différents : je soustrais les distances à zéro, je garde le signe du plus loin de zéro.");}
  else if(t===2){q=N(a)+" − "+P(b);ans=a-b;ex="Soustraire "+P(b)+", c'est ajouter son opposé : "+N(a)+" + "+P(-b)+".";}
  else if(t===3){q=N(a)+" + "+N(Math.abs(b))+" × "+P(c);b=Math.abs(b);ans=a+b*c;ex="D'abord "+b+" × "+P(c)+" = "+N(b*c)+", puis "+N(a)+" + "+P(b*c)+".";}
  else if(t===4){q="("+N(a)+" + "+P(b)+") × "+P(c);ans=(a+b)*c;ex="D'abord la parenthèse : "+N(a+b)+", puis × "+P(c)+".";}
  else {const k=nz(); c=nz(); b=c*k-a; if(!b||Math.abs(b)>30) return genRel(); q="("+N(a)+" + "+P(b)+") ÷ "+P(c);ans=k;ex="D'abord la parenthèse : "+N(c*k)+", puis ÷ "+P(c)+". Attention au signe.";}
  return {q:q+" = ?",ans,ex:ex+" Résultat : "+N(ans)+"."};
}
function genFreq(){
  const tot=[10,20,25,50][rnd(0,3)], eff=rnd(1,tot-1), pct=Math.random()<.6;
  const dec=eff/tot;
  return {q:"Une valeur a un effectif de "+eff+" sur un effectif total de "+tot+". Quelle est sa fréquence "+(pct?"en pourcentage ?":"en nombre décimal ?"),ans:pct?dec*100:dec,ex:eff+" ÷ "+tot+" = "+N(dec)+(pct?", puis × 100 = "+N(dec*100)+" %":"")+"."};
}
function genMoy(){
  const start=rnd(0,2), k=rnd(3,4), vals=Array.from({length:k},(_,i)=>start+i), effs=vals.map(()=>rnd(1,6));
  const N=effs.reduce((s,x)=>s+x,0), S=vals.reduce((s,v,i)=>s+v*effs[i],0), m=Math.round(S/N*10)/10;
  return {q:vals.map((v,i)=>v+" → "+effs[i]+" fois").join(" ; ")+". Moyenne arrondie au dixième ?",ans:m,ex:"N = "+effs.join(" + ")+" = "+N+". Somme = "+vals.map((v,i)=>"("+v+" × "+effs[i]+")").join(" + ")+" = "+S+". Moyenne = "+S+" ÷ "+N+" ≈ "+N_(m)+"."};
}
const N_=x=>String(x).replace(".",",");
function genMed(){
  const n=rnd(5,9), vals=Array.from({length:n},()=>rnd(1,20)), s=vals.slice().sort((a,b)=>a-b);
  const m=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
  return {q:"Médiane de : "+vals.join(" ; ")+" ?",ans:m,ex:"Rangées : "+s.join(" ; ")+". N = "+n+(n%2?" (impair) : rang "+(n+1)/2+" → "+N_(m)+".":" (pair) : rangs "+n/2+" et "+(n/2+1)+" → ("+s[n/2-1]+" + "+s[n/2]+") ÷ 2 = "+N_(m)+".")};
}
function genVit(){
  if(Math.random()<.5){const v=rnd(2,12)/2, t=rnd(2,20); const d=Math.round(v*t*10)/10; return {q:"Une goutte parcourt "+N_(d)+" m en "+t+" s. Sa vitesse en m/s ?",ans:v,ex:"v = d ÷ t = "+N_(d)+" ÷ "+t+" = "+N_(v)+" m/s."};}
  const v=rnd(3,13)*10, t=rnd(1,4); return {q:"Une voiture parcourt "+(v*t)+" km en "+t+" h. Sa vitesse en km/h ?",ans:v,ex:"v = d ÷ t = "+(v*t)+" ÷ "+t+" = "+v+" km/h."};
}
function genPyth(){
  const T=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[12,16,20]][rnd(0,6)];
  if(Math.random()<.5) return {q:"Triangle rectangle : les côtés de l'angle droit mesurent "+T[0]+" cm et "+T[1]+" cm. Longueur de l'hypoténuse ?",ans:T[2],ex:"hyp² = "+T[0]+"² + "+T[1]+"² = "+(T[0]*T[0])+" + "+(T[1]*T[1])+" = "+(T[2]*T[2])+", donc hyp = "+T[2]+" cm."};
  return {q:"Triangle rectangle : l'hypoténuse mesure "+T[2]+" cm et un côté de l'angle droit "+T[0]+" cm. Longueur de l'autre côté ?",ans:T[1],ex:"côté² = "+T[2]+"² − "+T[0]+"² = "+(T[2]*T[2])+" − "+(T[0]*T[0])+" = "+(T[1]*T[1])+", donc côté = "+T[1]+" cm."};
}
function startEx(id){
  const e=EI(id); playing=null; tab="ex";
  R={id,i:0,score:0,ans:null,err:0,done:false,miss:[]};
  if(e.type==="sort") R.items=shuffle(e.items);
  if(e.type==="order"){R.pool=shuffle(e.steps); R.placed=[]; R.wrong=null;}
  if(e.type==="calc"){R.qs=Array.from({length:e.n},()=>e.gen==="rel"?genRel():e.gen==="moy"?genMoy():e.gen==="med"?genMed():e.gen==="vit"?genVit():e.gen==="pyth"?genPyth():genFreq()); R.val="";}
  if(e.type==="write"){R.shown=false; R.ck={};}
  if(e.type==="flash"){R.queue=shuffle(e.cards.map((_,k)=>k)); R.first={}; R.flip=false; R.total=e.cards.length;}
  render(); window.scrollTo(0,0);
}

  } else L.push("Pas de programme prévu ce jour.");
  const qs=[]; QUIZ.forEach(q=>attempts(q.id).filter(a=>a.d===k).forEach(a=>qs.push("- Quiz "+q.t+" : "+a.score+"/"+a.total+(a.miss.length?" (raté : "+a.miss.join(", ")+")":""))));

  L.push("Quiz et entraînements du jour :"+(qs.length?"":" aucun")); qs.forEach(x=>L.push(x));
  const late=[]; PLAN.forEach(p=>{ if(p.d<k) p.blocs.forEach(b=>{ if(!S.rate[b.id]) late.push(fmt(p.d,{weekday:"short",day:"numeric"})+" – "+b.s+" : "+b.t); }); });
  if(late.length){L.push("Blocs des jours d'avant pas faits :"); late.forEach(x=>L.push("- "+x));}
  const rev=[]; PLAN.forEach(p=>p.blocs.forEach(b=>{ if(S.rate[b.id]==="r") rev.push(b.s+" : "+b.t); }));
  if(rev.length){L.push("En rouge (à revoir) :"); rev.forEach(x=>L.push("- "+x));}
  const cs=CTRL.filter(c=>c.d>=k); if(cs.length){L.push("Contrôles :"); cs.forEach(c=>{const Rd=readiness(c); L.push("- "+c.s+" ("+fmt(c.d,{weekday:"short",day:"numeric"})+") : "+LV[Rd.level]+(Rd.miss.length?" – il manque : "+Rd.miss.join(" ; "):""));});}
  L.push(cartLine(k));
  if(S.mood[k]) L.push("Aujourd'hui c'était : "+S.mood[k]);
  return L.join("\n");
}

const T={id:null,left:900,running:false,iv:null,end:0};
function clockText(){const s=Math.max(0,Math.round(T.left));return pad(Math.floor(s/60))+":"+pad(s%60);}
function startTimer(id,secs){stopTimer(); T.id=id; T.left=secs; T.running=true; T.end=Date.now()+secs*1000; T.iv=setInterval(tick,500);}
function pauseTimer(){T.running=false; clearInterval(T.iv); T.left=Math.max(0,(T.end-Date.now())/1000);}
function stopTimer(){clearInterval(T.iv); T.running=false; T.id=null; T.left=900;}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(); [0,.35].forEach(t=>{const o=a.createOscillator(),g=a.createGain(); o.frequency.value=660; g.gain.value=.15; o.connect(g); g.connect(a.destination); o.start(a.currentTime+t); o.stop(a.currentTime+t+.2);});}catch(e){}}
function tick(){T.left=Math.max(0,(T.end-Date.now())/1000); const c=$("#clock"); if(c&&openId===T.id) c.textContent=clockText(); if(T.left<=0){clearInterval(T.iv); T.running=false; beep(); if(c&&openId===T.id) c.textContent="Fini !"; const g=$("#tgo"); if(g&&openId===T.id) g.textContent="Encore un peu"; T.left=900;}}

      '<div class="row cart-nav"><button type="button" class="btn ghost small" data-cday="prev" aria-label="Jour de cours précédent">◀</button><span class="small">Semaine '+w+' (Pronote : « S'+w+' »)</span><button type="button" class="btn ghost small" data-cday="next" aria-label="Jour de cours suivant">▶</button></div></div>'+
      '<div class="edt">'+(cours.length?cours.map(([hh,s])=>'<span class="edt-c" style="--h:'+(H[s]||220)+'"><b>'+esc(hh)+'</b> '+esc(s)+'</span>').join(""):'<span class="small">Pas de cours ce jour-là.</span>')+'</div>'+
      ev.map(c=>'<div class="callout warn"><b>Contrôle : '+esc(c.s)+'. '+esc(c.t)+'</b><span class="small">Ce soir : je relis la fiche 10 minutes, puis je dors.</span></div>').join("")+
      '<p class="muted">Je coche quand l\'objet est DANS le cartable. <b>'+n+'/'+PL.length+'</b></p>'+
      stepsHTML(PL,st.p,"p")+
      (pDone?'<div class="callout ok"><b>Cartable prêt.</b><span>Bravo. Demain matin, je le prends près de la porte avec l\'enregistreur dedans.</span></div>':'');
  }
  return tabs+plug+body+'<details class="box2"><summary>Pour maman</summary><div class="stack small"><p>L\'emploi du temps vient de Pronote (semaines SA / SB). Les remplacements ne sont pas affichés : Hugo vérifie Pronote le soir.</p><p>Si la semaine A/B affichée est fausse : <button type="button" class="btn ghost small" id="abflip">Inverser A et B</button></p><p>Les cases cochées apparaissent dans le bilan d\'Hugo et dans l\'espace parent.</p></div></details>';
}
function cartWire(){
  document.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{cartMode=b.dataset.cm; render(); window.scrollTo(0,0);});
  document.querySelectorAll("[data-cday]").forEach(b=>b.onclick=()=>{const cur=cartFor||nextSchoolDay(todayKey); cartFor=b.dataset.cday==="next"?nextSchoolDay(cur):prevSchoolDay(cur); render();});
  document.querySelectorAll("[data-cs]").forEach(c=>c.onchange=()=>{const [k,i]=c.dataset.cs.split("|"); const st=cartState(todayKey); if(c.checked) st[k][i]=true; else delete st[k][i]; save(); render();
    const nx=document.querySelector(".cart-list li.now"); if(nx&&c.checked) nx.scrollIntoView({block:"nearest",behavior:"smooth"});});
  const ab=$("#abflip"); if(ab) ab.onclick=()=>{S.abFlip=!S.abFlip; save(); render();};
}
function cartLine(k){const d=cartDone(k), st=(S.cart||{})[k]||{p:{}}; const PL=prepList(nextSchoolDay(k));
  const plaud=PL.findIndex(x=>x[0].startsWith("Je mets l'enregistreur"));
  return "Cartable : vidé "+(d.v?"oui":"non")+", préparé pour demain "+(d.p?"oui":"non")+", enregistreur dans le sac "+(st.p&&st.p[plaud]?"oui":"non");}

render();

</script>
